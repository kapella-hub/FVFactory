services:
  # Always-on Streamlit library UI
  library:
    build: .
    container_name: fvfactory-library
    restart: unless-stopped
    ports:
      - "8501:8501"
    # .env as real environment variables too, so the script-LLM CLIs see CLAUDE_CODE_OAUTH_TOKEN /
    # ANTHROPIC_API_KEY / CODEX_API_KEY (the app itself reads the mounted /workspace/.env)
    env_file: .env
    volumes:
      - ./output:/workspace/output
      - ./.env:/workspace/.env:ro
      # Optional: Codex ChatGPT-plan login. Run `codex login` on the host first (or set CODEX_API_KEY in
      # .env instead); read-write because Codex refreshes its token in ~/.codex/auth.json.
      - ${HOME}/.codex:/root/.codex
    environment:
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "app/library.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]

  # On-demand video generation (run with: docker compose run --rm generator ./daily.sh)
  generator:
    build: .
    container_name: fvfactory-generator
    env_file: .env                   # see the library service
    volumes:
      - ./output:/workspace/output
      - ./.env:/workspace/.env:ro
      - ${HOME}/.codex:/root/.codex  # optional Codex login, see the library service
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - generate
    command: ["./daily.sh"]
