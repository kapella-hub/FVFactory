services:
  # Always-on Streamlit library UI
  library:
    build: .
    container_name: fvfactory-library
    restart: unless-stopped
    ports:
      - "8501:8501"
    # No env_file: the app reads the mounted /workspace/.env and passes each script-LLM CLI only its own
    # auth (CLAUDE_CODE_OAUTH_TOKEN / CODEX_API_KEY from .env), so a restart rereads .env.
    volumes:
      - ./output:/workspace/output
      - ./.env:/workspace/.env:ro
      # Optional: Codex ChatGPT-plan login. Run `codex login` on the host first (or set CODEX_API_KEY in
      # .env instead); read-write because Codex refreshes its token in ~/.codex/auth.json.
      - ${HOME:-/root}/.codex:/root/.codex
    environment:
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "app/library.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]

  # On-demand video generation (run with: docker compose run --rm generator ./daily.sh)
  generator:
    build: .
    container_name: fvfactory-generator
    volumes:
      - ./output:/workspace/output
      - ./.env:/workspace/.env:ro
      - ${HOME:-/root}/.codex:/root/.codex  # optional Codex login, see the library service
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - generate
    command: ["./daily.sh"]
