services:
  # Web UI (FastAPI): Generate form, Scheduler, Settings, Library -> http://localhost:8000
  web:
    build: .
    image: fvfactory:latest
    container_name: fvfactory-web
    restart: unless-stopped
    # The UI has no login: publish on this machine only. Put it behind auth/VPN before exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    # No env_file: the app reads the mounted /workspace/.env and passes each script-LLM CLI only its own
    # auth (CLAUDE_CODE_OAUTH_TOKEN / CODEX_API_KEY from .env), so a restart rereads .env.
    volumes: &app_volumes
      - ./output:/workspace/output
      - ./data:/workspace/data                    # Settings page (config.json), music LRU history
      - ./assets/music:/workspace/assets/music    # your tracks + generated library survive rebuilds
      - ./assets/sfx:/workspace/assets/sfx
      - ./.env:/workspace/.env:ro
      # Codex ChatGPT-plan login: copy ~/.codex/auth.json from a machine where `codex login` ran into
      # ./data/codex/auth.json (read-write: Codex refreshes the token). Not the whole ~/.codex: its
      # config.toml names host-only MCP servers and models. Or set CODEX_API_KEY in .env instead.
      - ./data/codex:/root/.codex
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "--serve"]

  # On-demand video generation (run with: docker compose run --rm generator ./daily.sh)
  generator:
    image: fvfactory:latest
    container_name: fvfactory-generator
    volumes: *app_volumes
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - generate
    command: ["./daily.sh"]
