<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FVFactory</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='16' width='100' height='100' fill='%2312121a'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='60'>▶</text></svg>">
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar__brand">
      <div class="topbar__brand-icon">▶</div>
      <span class="topbar__brand-text">FVFactory</span>
    </div>
    <span class="topbar__title" id="page-title">Dashboard</span>
    <div class="topbar__spacer"></div>
    <div class="topbar__status">
      <span class="topbar__dot" id="ws-indicator"></span>
      <span id="ws-status">Connecting...</span>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar__nav">
      <a href="/" class="sidebar__link sidebar__link--active" data-page="dashboard" aria-label="Dashboard">
        <span class="sidebar__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
        <span class="sidebar__label">Dashboard</span>
      </a>
      <a href="/generate" class="sidebar__link" data-page="generate" aria-label="Generate">
        <span class="sidebar__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
        <span class="sidebar__label">Generate</span>
      </a>
      <a href="/library" class="sidebar__link" data-page="library" aria-label="Library">
        <span class="sidebar__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg></span>
        <span class="sidebar__label">Library</span>
      </a>
      <a href="/scheduler" class="sidebar__link" data-page="scheduler" aria-label="Scheduler">
        <span class="sidebar__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
        <span class="sidebar__label">Scheduler</span>
      </a>
      <a href="/settings" class="sidebar__link" data-page="settings" aria-label="Settings">
        <span class="sidebar__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="sidebar__label">Settings</span>
      </a>
    </div>
    <div class="sidebar__footer">
      <span class="sidebar__label">v2.0</span>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <div id="app">
      <div class="loading-spinner">
        <div class="loading-spinner__circle"></div>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/generate.js"></script>
  <script src="/static/js/library.js"></script>
  <script src="/static/js/scheduler.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/app.js"></script>

</body>
</html>
